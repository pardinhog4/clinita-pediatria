name: integrar-mvp
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: integrar
      POSTGRES_USER: integrar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup:env}
    ports:
      - '127.0.0.1:5547:5432'
    volumes:
      - integrar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U integrar -d integrar']
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  integrar_pgdata:
